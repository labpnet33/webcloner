name: Validate website capture scripts

on:
  push:
    paths:
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/validate-capture.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/validate-capture.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Bash syntax
        run: |
          bash -n scripts/capture-site.sh
          bash -n scripts/capture-extra.sh
          bash -n scripts/capture-all.sh
      - name: Validate Node syntax
        run: node --check scripts/capture-site.cjs
      - name: Verify help entrypoint works without installing dependencies
        run: |
          bash scripts/capture-site.sh --help
          bash scripts/capture-extra.sh --help
          bash scripts/capture-all.sh --help
